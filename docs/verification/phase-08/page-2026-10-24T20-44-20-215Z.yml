      - paragraph [ref=e17]: Describe where the trip starts, where it ends, when you leave, and what you are hauling. StormRoute asks the Mapbox Directions API for genuine driving alternatives, samples each one into checkpoints at your chosen spacing, and shows distance, driving time, estimated arrival, checkpoint timing, and hourly weather (wind, rain, snow) at each checkpoint arrival. Risk comparison, route ranking, and the interactive map are now live.
