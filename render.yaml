# Render blueprint for the StormRoute backend (Django + DRF, no DB models —
# migrate only touches Django system tables, safe to auto-run).
#
# Deploy via Render Blueprint: repo root -> New Blueprint -> this file.
# Placeholders marked `sync: false` must be filled in the Render dashboard
# on first sync (values are account-specific; never commit real secrets).
#
# Frontend (Netlify) uses a relative /api/* rewrite pointing at this service's
# public URL — see netlify.toml and the README "Deploy" section.

services:
  - type: web
    name: stormroute-backend
    runtime: python
    plan: free
    rootDir: backend
    # Python version pin (Render reads this env var)
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Hardening (settings.py reads these)
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECURE
        value: "1"
      # Long random secret generated by Render at blueprint sync (never commited).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # The public hostname of THIS service, e.g. "stormroute-backend.onrender.com"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # The Netlify site URL, e.g. "https://stormroute.netlify.app"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Server-side only Mapbox token; never reaches the frontend bundle.
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput
    # Route generation + hourly weather sampling can take 60-120 s against
    # live providers; the default 30 s worker timeout would kill it.
    startCommand: gunicorn stormroute.wsgi:application --bind 0.0.0.0:$PORT --timeout 180
